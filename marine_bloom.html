<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d2743"><title>Marine Bloom Cafe | Summer Paradise Resort</title><style>:root{--navy:#0d2743;--gold:#a87b2f;--cream:#fbf8f1}*{box-sizing:border-box}body{margin:0;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;color:var(--navy)}header{height:66px;display:grid;grid-template-columns:60px 1fr 60px;align-items:center;border-bottom:1px solid #eee8dc;position:sticky;top:0;background:#fff;z-index:3}.back{border:0;background:none;color:var(--navy)}.title{text-align:center;font:11px Georgia,serif;letter-spacing:.14em;color:var(--gold)}main{max-width:720px;margin:auto;padding:28px 18px 60px}h1{text-align:center;font-weight:400;letter-spacing:.1em}.sub{text-align:center;color:var(--gold);font:10px Georgia,serif;letter-spacing:.18em}h2{margin-top:30px;font-size:15px;font-weight:500;letter-spacing:.1em;border-bottom:1px solid #e7dfd1;padding-bottom:9px}.grid{display:grid;gap:8px}.item{border:1px solid #e7dfd1;background:#fff;padding:13px;text-align:left;color:var(--navy)}.item.selected{border-color:var(--gold);background:#fffaf0;box-shadow:inset 3px 0 0 var(--gold)}.item small{display:block;color:#8a7656;margin-top:4px}.order{width:100%;min-height:50px;margin-top:24px;border:0;background:var(--navy);color:#fff;letter-spacing:.1em}.order:disabled{opacity:.35}.status{margin-top:13px;padding:13px;background:var(--cream);border:1px solid #e1d4bd;text-align:center;font-size:12px;line-height:1.9}.coaster{margin-top:14px;text-align:center}.coaster img{max-width:260px;width:70%;height:auto;margin:auto;display:block}</style></head><body><header><button class="back" onclick="location.href='cafe.html'">← BACK</button><div class="title">MARINE BLOOM CAFE</div><div></div></header><main><h1>Marine Bloom Cafe</h1><div class="sub">LUNCH &amp; CAFE</div><h2>お食事</h2><div class="grid" id="meals"><button class="item" data-value="ラボ・デ・トロ">ラボ・デ・トロ</button><button class="item" data-value="シーフード・パエリアプレート">シーフード・パエリアプレート</button><button class="item" data-value="地中海デリプレート">地中海デリプレート</button><button class="item" data-value="レモンチキンプレート">レモンチキンプレート</button></div><h2>ドリンク <small style="font-weight:400">※必須</small></h2><div class="grid" id="drinks"><button class="item" data-value="ブレンドコーヒー">ブレンドコーヒー<small>CAFE DRINK</small></button><button class="item" data-value="アールグレイ">アールグレイ<small>CAFE DRINK</small></button><button class="item" data-value="アイスティー">アイスティー<small>CAFE DRINK</small></button><button class="item" data-value="カフェラテ">カフェラテ<small>CAFE DRINK</small></button><button class="item" data-value="レモネード">レモネード<small>CAFE DRINK</small></button><button class="item" data-value="オレンジジュース">オレンジジュース<small>CAFE DRINK</small></button></div><button id="order" class="order" disabled>注文する</button><div id="status" class="status">お食事とドリンクを1つずつお選びください。</div><div id="coaster" class="coaster"></div></main><script>const VENUE='Marine Bloom Cafe',KEY='marine',COASTERS=['coaster53.PNG', 'coaster54.PNG', 'coaster55.PNG', 'coaster56.PNG', 'coaster57.PNG', 'coaster58.PNG', 'coaster59.PNG', 'coaster60.PNG', 'coaster61.PNG', 'coaster62.PNG', 'coaster63.PNG', 'coaster64.PNG', 'coaster65.PNG', 'coaster66.PNG', 'coaster67.PNG', 'coaster68.PNG', 'coaster69.PNG', 'coaster70.PNG', 'coaster71.PNG', 'coaster72.PNG', 'coaster73.PNG', 'coaster74.PNG', 'coaster75.PNG', 'coaster76.PNG', 'coaster77.PNG', 'coaster78.PNG', 'coaster79.PNG', 'coaster80.PNG', 'coaster81.PNG', 'coaster82.PNG', 'coaster83.PNG', 'coaster84.PNG', 'coaster85.PNG', 'coaster86.PNG', 'coaster87.PNG', 'coaster88.PNG'];let meal='',drink='';function bind(id,setter){document.querySelectorAll('#'+id+' .item').forEach(b=>b.onclick=()=>{document.querySelectorAll('#'+id+' .item').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');setter(b.dataset.value);refresh()})}function refresh(){document.getElementById('order').disabled=!(meal&&drink);document.getElementById('status').textContent=meal&&drink?`${meal} ＋ ${drink} を注文できます。`:'お食事とドリンクを1つずつお選びください。'}bind('meals',v=>meal=v);bind('drinks',v=>drink=v);document.getElementById('order').onclick=()=>{if(!meal||!drink)return;const file=COASTERS[Math.floor(Math.random()*COASTERS.length)];const invKey='spr-cafe-coasters';let inv=[];try{inv=JSON.parse(localStorage.getItem(invKey)||'[]')}catch{}inv.push({venue:VENUE,file,meal,drink,at:new Date().toISOString()});localStorage.setItem(invKey,JSON.stringify(inv));document.getElementById('status').textContent=`${meal} と ${drink} を注文しました。コースターを1枚受け取りました。`;document.getElementById('coaster').innerHTML=`<img src="${file}" alt="ランダムコースター"><p>${file}</p>`;};</script></body></html>
