<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d2743"><title>CAFE | Summer Paradise Resort</title><style>body{margin:0;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;color:#0d2743;background:#fff url("cafe_floor.jpg") center/cover fixed no-repeat}header{height:66px;display:grid;grid-template-columns:60px 1fr 60px;align-items:center;border-bottom:1px solid #eee8dc;position:sticky;top:0;background:#fff;z-index:3}.back{border:0;background:none;color:#0d2743}.title{text-align:center;font:12px Georgia,serif;letter-spacing:.18em;color:#a87b2f}.wrap{max-width:760px;margin:auto;padding:42px 18px 80px;min-height:calc(100vh - 66px);background:rgba(255,255,255,.20);backdrop-filter:blur(1px)}.lead{text-align:center;line-height:2;color:#24394e;font-size:13px;text-shadow:0 1px 8px rgba(255,255,255,.95)}.venues{display:grid;gap:14px;margin-top:25px}.venue{border:1px solid rgba(168,123,47,.38);background:rgba(255,252,245,.90);padding:26px 22px;text-align:center;color:#0d2743;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;box-shadow:0 8px 24px rgba(13,39,67,.08)}.venue strong{display:block;font-family:Georgia,"Times New Roman",serif;font-size:21px;font-weight:400;letter-spacing:.12em}.venue small{display:block;margin-top:9px;color:#a87b2f;font-family:Georgia,"Times New Roman",serif;font-size:10px;letter-spacing:.20em}</style></head><body><audio id="cafeBgm" src="cafe_bgm.mp3" preload="auto" loop></audio><header><button class="back" onclick="location.href='day1.html'">← BACK</button><div class="title">CAFE</div><div></div></header><main class="wrap"><h1 style="text-align:center;font-weight:400;letter-spacing:.12em">CAFE</h1><p class="lead">ご利用になるカフェをお選びください。<br>各カフェは別ページでご案内します。</p><div class="venues"><button class="venue" onclick="location.href='pearl_terrace.html'"><strong>The Pearl Terrace</strong><small>THE PEARL TERRACE</small></button><button class="venue" onclick="location.href='marine_bloom.html'"><strong>Marine Bloom Cafe</strong><small>MARINE BLOOM CAFE</small></button></div></main><script>
(()=>{
  const audio=document.getElementById('cafeBgm');
  if(!audio)return;

  const STATE_KEY='spr-cafe-bgm-state-v2';
  const load=()=>{
    try{return JSON.parse(localStorage.getItem(STATE_KEY)||'{}')||{}}
    catch{return {}}
  };
  const save=()=>{
    try{
      localStorage.setItem(STATE_KEY,JSON.stringify({
        time:Number(audio.currentTime)||0,
        playing:!audio.paused,
        savedAt:Date.now()
      }));
    }catch{}
  };

  async function resumeCafeBgm(){
    const s=load();
    let t=Number(s.time)||0;

    // Approximate continuous playback while navigating between CAFE pages.
    if(s.playing && s.savedAt){
      t += Math.max(0,(Date.now()-Number(s.savedAt))/1000);
    }

    const applyTime=()=>{
      if(Number.isFinite(t) && t>=0){
        try{
          if(Number.isFinite(audio.duration) && audio.duration>0) t=t%audio.duration;
          audio.currentTime=t;
        }catch{}
      }
    };

    if(audio.readyState>=1) applyTime();
    else audio.addEventListener('loadedmetadata',applyTime,{once:true});

    try{
      await audio.play();
      save();
    }catch{}
  }

  resumeCafeBgm();

  // iOS/Safari fallback if autoplay is temporarily blocked.
  const unlock=()=>{
    if(audio.paused) resumeCafeBgm();
  };
  document.addEventListener('pointerdown',unlock,{passive:true});
  document.addEventListener('touchstart',unlock,{passive:true});

  // Save frequently enough that page navigation resumes almost seamlessly.
  const timer=setInterval(save,250);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') save(); });
  addEventListener('pagehide',save);
  addEventListener('beforeunload',save);
  addEventListener('pageshow',()=>{ if(audio.paused) resumeCafeBgm(); });
})();
</script></body></html>
