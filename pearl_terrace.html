<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d2743"><title>The Pearl Terrace | Summer Paradise Resort</title><style>:root{--navy:#0d2743;--gold:#a87b2f;--cream:#fbf8f1}*{box-sizing:border-box}body{margin:0;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;color:var(--navy);background:linear-gradient(rgba(255,255,255,.68),rgba(255,255,255,.68)),url("the_pearl_terrace_i.jpg") center/cover fixed no-repeat}header{height:66px;display:grid;grid-template-columns:60px 1fr 60px;align-items:center;border-bottom:1px solid #eee8dc;position:sticky;top:0;background:#fff;z-index:3}.back{border:0;background:none;color:var(--navy)}.title{text-align:center;font:11px Georgia,serif;letter-spacing:.14em;color:var(--gold)}main{max-width:720px;margin:auto;padding:28px 18px 60px;background:rgba(255,255,255,.36);backdrop-filter:blur(1px);min-height:calc(100vh - 66px)}h1{text-align:center;font-weight:400;letter-spacing:.1em}.sub{text-align:center;color:var(--gold);font:10px Georgia,serif;letter-spacing:.18em}h2{margin-top:30px;font-size:15px;font-weight:500;letter-spacing:.1em;border-bottom:1px solid #e7dfd1;padding-bottom:9px}.grid{display:grid;gap:8px}.item{border:1px solid #e7dfd1;background:#fff;padding:13px;text-align:left;color:var(--navy)}.item.selected{border-color:var(--gold);background:#fffaf0;box-shadow:inset 3px 0 0 var(--gold)}.item small{display:block;color:#8a7656;margin-top:4px}.order{width:100%;min-height:50px;margin-top:24px;border:0;background:var(--navy);color:#fff;letter-spacing:.1em}.order:disabled{opacity:.35}.status{margin-top:13px;padding:13px;background:var(--cream);border:1px solid #e1d4bd;text-align:center;font-size:12px;line-height:1.9}.modal{position:fixed;inset:0;background:rgba(5,18,32,.62);display:none;align-items:center;justify-content:center;padding:24px;z-index:20}.modal.show{display:flex}.modal-card{position:relative;width:min(92vw,430px);max-height:88vh;overflow:auto;background:#fffdf8;border:1px solid #d8c39c;box-shadow:0 22px 70px rgba(0,0,0,.35);padding:28px 20px 24px;text-align:center}.modal-close{position:absolute;right:10px;top:8px;width:36px;height:36px;border:0;background:transparent;color:#0d2743;font-size:28px;line-height:1}.modal img{display:block;width:min(100%,330px);height:auto;margin:8px auto 12px}.modal-label{font-family:Georgia,"Times New Roman",serif;color:#a87b2f;letter-spacing:.14em;font-size:11px}.staff{display:none;margin:0 0 16px;padding:15px 16px;background:#fbf8f1;border:1px solid #e1d4bd;text-align:left;line-height:1.9;font-size:13px}.staff.show{display:block}.staff-name{display:block;color:#a87b2f;font-size:11px;letter-spacing:.12em;margin-bottom:5px}.staff{display:none!important}.staff-dialogue{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center;padding:0 18px max(9vh,42px);background:rgba(255,255,255,.76);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .55s ease,visibility .55s}.staff-dialogue.show{opacity:1;visibility:visible}.staff-dialogue-box{width:min(720px,94vw);padding:24px 26px 22px;background:rgba(255,255,255,.93);border-top:1px solid rgba(168,123,47,.48);box-shadow:0 14px 48px rgba(13,39,67,.14);position:relative}.staff-dialogue-name{font:11px Georgia,serif;letter-spacing:.24em;color:#a87b2f;margin-bottom:12px}.staff-dialogue-text{font-size:14px;line-height:2.05;letter-spacing:.045em;color:#24394e}.staff-dialogue-next{display:block;margin:15px 0 0 auto;border:0;background:transparent;color:#a87b2f;font:11px Georgia,serif;letter-spacing:.15em}.staff-dialogue-box::before{content:"";position:absolute;left:0;top:0;width:46px;height:1px;background:#a87b2f}@media(max-width:520px){.staff-dialogue{padding:0 12px max(7vh,28px)}.staff-dialogue-box{padding:21px 20px 18px}.staff-dialogue-text{font-size:13px}}</style></head><body><header><button class="back" onclick="location.href='cafe.html'">← BACK</button><div class="title">THE PEARL TERRACE</div><div></div></header><main><h1>The Pearl Terrace</h1><div class="sub">LUNCH &amp; CAFE</div><h2>お食事</h2><div class="grid" id="meals"><button class="item" data-value="ラボ・デ・トロ">ラボ・デ・トロ</button><button class="item" data-value="シーフード・パエリアプレート">シーフード・パエリアプレート</button><button class="item" data-value="地中海デリプレート">地中海デリプレート</button><button class="item" data-value="レモンチキンプレート">レモンチキンプレート</button></div><h2>ドリンク</h2><div class="grid" id="drinks"><button class="item" data-value="ブレンドコーヒー">ブレンドコーヒー<small>CAFE DRINK</small></button><button class="item" data-value="アールグレイ">アールグレイ<small>CAFE DRINK</small></button><button class="item" data-value="アイスティー">アイスティー<small>CAFE DRINK</small></button><button class="item" data-value="カフェラテ">カフェラテ<small>CAFE DRINK</small></button><button class="item" data-value="レモネード">レモネード<small>CAFE DRINK</small></button><button class="item" data-value="オレンジジュース">オレンジジュース<small>CAFE DRINK</small></button></div><div id="staff" class="staff"><span class="staff-name">STAFF</span><span id="staffText"></span></div><button id="order" class="order" disabled>注文する</button><div id="status" class="status">食事とドリンクをお選びください。</div><div id="coasterModal" class="modal" aria-hidden="true"><div class="modal-card"><button id="coasterClose" class="modal-close" aria-label="閉じる">×</button><div class="modal-label">COMPLIMENTARY COASTER</div><img id="coasterImage" alt="ランダムコースター"><p id="coasterFile"></p></div></div><div id="staffDialogue" class="staff-dialogue" aria-hidden="true"><div class="staff-dialogue-box"><div class="staff-dialogue-name">STAFF</div><div id="staffDialogueText" class="staff-dialogue-text"></div><button id="staffDialogueClose" class="staff-dialogue-next" type="button">CLOSE　×</button></div></div></main><script>const VENUE='The Pearl Terrace',KEY='pearl',COASTERS=['coaster00.PNG', 'coaster01.PNG', 'coaster02.PNG', 'coaster03.PNG', 'coaster04.PNG', 'coaster05.PNG', 'coaster06.PNG', 'coaster07.PNG', 'coaster08.PNG', 'coaster09.PNG', 'coaster10.PNG', 'coaster11.PNG', 'coaster12.PNG', 'coaster13.PNG', 'coaster14.PNG', 'coaster15.PNG', 'coaster16.PNG', 'coaster17.PNG', 'coaster18.PNG', 'coaster19.PNG', 'coaster20.PNG', 'coaster21.PNG', 'coaster22.PNG', 'coaster23.PNG', 'coaster24.PNG', 'coaster25.PNG', 'coaster26.PNG', 'coaster27.PNG', 'coaster28.PNG', 'coaster29.PNG', 'coaster30.PNG', 'coaster31.PNG', 'coaster32.PNG', 'coaster33.PNG', 'coaster34.PNG', 'coaster35.PNG', 'coaster36.PNG', 'coaster37.PNG', 'coaster38.PNG', 'coaster39.PNG', 'coaster40.PNG', 'coaster41.PNG', 'coaster42.PNG', 'coaster43.PNG', 'coaster44.PNG', 'coaster45.PNG', 'coaster46.PNG', 'coaster47.PNG', 'coaster48.PNG', 'coaster49.PNG', 'coaster50.PNG', 'coaster51.PNG', 'coaster52.PNG'];let meal='',drink='';function bind(id,setter){document.querySelectorAll('#'+id+' .item').forEach(b=>b.onclick=()=>{document.querySelectorAll('#'+id+' .item').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');setter(b.dataset.value);refresh()})}function refresh(){document.getElementById('order').disabled=!(meal&&drink);document.getElementById('status').textContent=meal&&drink?`${meal} ＋ ${drink} を注文できます。`:'食事とドリンクをお選びください。'}bind('meals',v=>meal=v);bind('drinks',v=>drink=v);document.getElementById('order').onclick=()=>{if(!meal||!drink)return;const file=COASTERS[Math.floor(Math.random()*COASTERS.length)];const invKey='spr-cafe-coasters';let inv=[];try{inv=JSON.parse(localStorage.getItem(invKey)||'[]')}catch{}inv.push({venue:VENUE,file,meal,drink,at:new Date().toISOString()});localStorage.setItem(invKey,JSON.stringify(inv));const firstKey='spr-cafe-coaster-event-seen';const isFirst=!localStorage.getItem(firstKey);document.getElementById('status').textContent=`${meal} と ${drink} を注文しました。`;const firstDialogue=isFirst;if(isFirst)localStorage.setItem(firstKey,'1')document.getElementById('coasterImage').src=file;document.getElementById('coasterFile').textContent=file;document.getElementById('coasterModal').classList.add('show');document.getElementById('coasterModal').setAttribute('aria-hidden','false');};document.getElementById('coasterClose').onclick=()=>{document.getElementById('coasterModal').classList.remove('show');document.getElementById('coasterModal').setAttribute('aria-hidden','true');if(firstDialogue){setTimeout(()=>{document.getElementById('staffDialogueText').textContent='あら、初めてでしたか？でしたら、こちらもどうぞ。ただいま期間限定で、記念のコースターをお配りしているんです。ぜひ旅のお供にしてくださいね！';const d=document.getElementById('staffDialogue');d.classList.add('show');d.setAttribute('aria-hidden','false')},260)}};document.getElementById('staffDialogueClose').onclick=()=>{const d=document.getElementById('staffDialogue');d.classList.remove('show');d.setAttribute('aria-hidden','true')};document.getElementById('coasterModal').onclick=e=>{if(e.target.id==='coasterModal')document.getElementById('coasterClose').click()};</script></body></html>
